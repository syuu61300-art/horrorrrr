<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haunted Mansion</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07070a;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:32px;box-sizing:border-box}
    .card{width:min(760px,100%);padding:42px;border:1px solid #3b3545;border-radius:20px;background:linear-gradient(145deg,#17131c,#0c0c11);box-shadow:0 20px 70px #0008}
    h1{font-size:clamp(36px,8vw,68px);margin:0 0 12px;letter-spacing:.04em}
    p{line-height:1.8;color:#bbb}
    code{background:#111017;padding:3px 7px;border-radius:6px}
    .note{margin-top:24px;padding:18px;border-radius:12px;background:#100d14;border:1px solid #2f2737}
    .ok{color:#ddd}
  </style>
</head>
<body>
  <main class="card">
    <h1>HAUNTED MANSION</h1>
    <p>Godot 4.xで制作中の3Dホラーゲーム「屋敷からの脱出」です。</p>
    <div class="note">
      <strong>GitHub Pages設定は正常です。</strong>
      <p class="ok">このリポジトリは現在、Godotの<strong>ソースプロジェクト</strong>を公開しています。ブラウザでゲーム本体を動かすには、Godotから<strong>Web</strong>へエクスポートしたファイルをこのページのルートに配置する必要があります。</p>
      <p>エクスポート後は、生成された <code>index.html</code> と関連ファイルをリポジトリへ追加してください。</p>
    </div>
  </main>
</body>
</html>
